<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Results Dashboard</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 40px;
  background: #f5f7fa;
}

h1 {
  text-align: center;
  margin-bottom: 40px;
}

.chart {
  max-width: 900px;
  margin: auto;
}

.bar-row {
  margin-bottom: 40px;
}

.label {
  font-size: 22px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
}

.bar-bg {
  background: #ddd;
  height: 40px;
  border-radius: 6px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0%;
  transition: width 0.5s ease;
}

#bar0 { background: #0077cc; }
#bar1 { background: #00a86b; }
#bar2 { background: #ff8c00; }
</style>
</head>

<body>

<h1>Community Priorities</h1>

<div class="chart">

  <div class="bar-row">
    <div class="label">
      <span>Pedestrian Density</span>
      <span id="val0">0%</span>
    </div>
    <div class="bar-bg">
      <div id="bar0" class="bar-fill"></div>
    </div>
  </div>

  <div class="bar-row">
    <div class="label">
      <span>Crash Data</span>
      <span id="val1">0%</span>
    </div>
    <div class="bar-bg">
      <div id="bar1" class="bar-fill"></div>
    </div>
  </div>

  <div class="bar-row">
    <div class="label">
      <span>Equity</span>
      <span id="val2">0%</span>
    </div>
    <div class="bar-bg">
      <div id="bar2" class="bar-fill"></div>
    </div>
  </div>

</div>

<button onclick="resetData()" style="margin-bottom:20px; padding:10px;">
  Reset Results
</button>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyApBHAc8pq_eh2Me4sZhfZwDmOmmV6W1tY",
  authDomain: "traffic-calming-prioritization.firebaseapp.com",
  databaseURL: "https://traffic-calming-prioritization-default-rtdb.firebaseio.com",
  projectId: "traffic-calming-prioritization",
  storageBucket: "traffic-calming-prioritization.firebasestorage.app",
  messagingSenderId: "137935918196",
  appId: "1:137935918196:web:c54ff8f194ed83c5f22d21",
  measurementId: "G-5W6JB4CVZS"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function resetData() {
  if (!confirm("Are you sure you want to reset all responses?")) return;

  db.collection("responses").get().then(snapshot => {
    const batch = db.batch();

    snapshot.forEach(doc => {
      batch.delete(doc.ref);
    });

    batch.commit().then(() => {
      alert("Results reset to 0");
    });
  });
}

// LIVE UPDATE
db.collection("responses").onSnapshot(snapshot => {
  let totals = [0,0,0];
  let count = 0;

  snapshot.forEach(doc => {
    let d = doc.data();
    totals[0] += d.safety;
    totals[1] += d.mobility;
    totals[2] += d.comfort;
    count++;
  });

  if (count > 0) {
    let avg = [
      Math.round(totals[0]/count),
      Math.round(totals[1]/count),
      Math.round(totals[2]/count)
    ];

    avg.forEach((val, i) => {
      document.getElementById("val"+i).innerText = val + "%";
      document.getElementById("bar"+i).style.width = val + "%";
    });
  }
});
</script>

</body>
</html>
